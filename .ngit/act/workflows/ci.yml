name: CI and deployments

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # `test:full` is the convenient local, sequential command for these checks.
  # CI runs its parts separately instead: the Nix job has the web and e2e
  # dependencies available, while Android lint needs its own JDK/SDK setup.
  # Keeping them as jobs also lets the slower Android check run in parallel.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Verify npm fallback lockfile
        run: nix develop --command npm ci --dry-run --ignore-scripts

      - name: Install Dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Run tests
        run: nix develop --command pnpm test

      - name: Run e2e tests
        run: nix develop --command pnpm test:e2e

      # Deploy the exact files produced by the test command instead of
      # rebuilding the application in either deployment job.
      - name: Upload tested web build
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist
          path: dist
          if-no-files-found: error
          include-hidden-files: true

  android-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - run: pnpm install --frozen-lockfile

      # Keep Android tooling outside the Nix job: this is the setup available
      # to regular GitHub Actions and the intentionally minimal act runner.
      - run: pnpm android:lint

  # The act runner shares one action checkout cache across parallel jobs. Give
  # each production deploy a distinct pinned download-action revision, and
  # warm both before fan-out, so concurrent action setup cannot mutate the
  # directory another job is copying into its container.
  prepare-web-deploys:
    runs-on: ubuntu-latest
    needs: [test, android-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Warm nsite artifact downloader
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
          path: dist-nsite

      - name: Warm Netlify artifact downloader
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: web-dist
          path: dist-netlify

  deploy-nsite-preview:
    runs-on: ubuntu-latest
    needs: [test, android-lint]
    if: github.event_name == 'pull_request'
    outputs:
      nsite_preview: ${{ steps.preview.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: danconwaydev/setup-ngit@v3

      - name: Download tested web build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
          path: dist

      # _redirects configures Netlify and is not part of the website. ngit
      # nsite paths require filename extensions, so exclude it here.
      - name: Prepare nsite artifact
        run: rm dist/_redirects

      # The local file-backed account and its secret disappear with this
      # untrusted job. Only its public npub crosses the step boundary.
      - name: Generate ephemeral preview identity
        id: identity
        run: |
          set -eu
          ngit account create \
            --name "GitWorkshop PR preview" \
            --offline \
            --local \
            --secret-storage file \
            --json
          preview_npub="$(git config --local --get nostr.npub)"
          case "$preview_npub" in
            npub1*) ;;
            *)
              echo "ngit did not activate a local preview account." >&2
              exit 1
              ;;
          esac
          printf 'npub=%s\n' "$preview_npub" >> "$GITHUB_OUTPUT"

      # GitHub checkouts do not have a nostr:// origin, so name the repository
      # explicitly. --no-config keeps the production named-site identifier out
      # of this root preview; --fallback maps index.html to /404.html without
      # uploading a duplicate blob.
      - name: Publish nsite preview
        run: |
          ngit nsite publish dist \
            --repo nostr://dan@gitworkshop.dev/gitnostr.com/gitworkshop \
            --no-config \
            --fallback index.html \
            --blossom-server https://blossom.primal.net \
            --blossom-server https://blossom.ditto.pub \
            --relay wss://relay.nsite.lol \
            --relay wss://nos.lol \
            --relay wss://relay.primal.net \
            --relay wss://nsite.run \
            --concurrency 12 \
            --defaults \
            --json

      # ngit-ci publishes this declared scalar on the signed Job Result. Wait
      # for the gateway to resolve the new manifest before exposing the URL so
      # a successful upload cannot advertise an unavailable root site.
      - name: Expose preview URL
        id: preview
        env:
          PREVIEW_NPUB: ${{ steps.identity.outputs.npub }}
        run: |
          set -eu
          : "${PREVIEW_NPUB:?The ephemeral preview npub is missing.}"
          preview_url="https://$PREVIEW_NPUB.nsite.cloud/"
          deadline=$((SECONDS + 120))
          until curl --fail --silent --show-error --max-time 15 \
            --output /dev/null "$preview_url"; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              printf 'Preview manifest did not become available at %s\n' \
                "$preview_url" >&2
              exit 1
            fi
            sleep 5
          done
          printf 'url=%s\n' "$preview_url" >> "$GITHUB_OUTPUT"

  deploy-netlify:
    runs-on: ubuntu-latest
    needs: [test, android-lint, prepare-web-deploys]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: netlify-production
      cancel-in-progress: true
    steps:
      # Keep netlify.toml in the workspace so the CLI deploy includes the
      # existing redirects, cache policy, and security headers.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download tested web build
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: web-dist
          path: dist

      - name: Deploy to Netlify production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -eu
          : "${NETLIFY_AUTH_TOKEN:?Set the NETLIFY_AUTH_TOKEN secret.}"
          : "${NETLIFY_SITE_ID:?Set the NETLIFY_SITE_ID secret.}"
          npx --yes netlify-cli@26.2.0 deploy \
            --prod \
            --no-build \
            --dir=dist \
            --message="ngit act $GITHUB_SHA"

  deploy-nsite-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, android-lint, prepare-web-deploys]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: nsite-production
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: danconwaydev/setup-ngit@v3

      - name: Download tested web build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
          path: dist

      # _redirects configures Netlify and is not part of the website. The
      # committed nsite config maps index.html to /404.html without uploading
      # a duplicate blob.
      - name: Prepare nsite artifact
        run: rm dist/_redirects

      # Reuse the established Amber connection without exposing its nbunksec
      # in the process arguments. The committed .nsite/config.json supplies
      # the named-site metadata, fallback, relays, and Blossom servers.
      - name: Publish production nsite
        env:
          NGIT_PUBLISHER_NBUNKSEC: ${{ secrets.NGIT_PUBLISHER_NBUNKSEC }}
        run: |
          set -eu
          : "${NGIT_PUBLISHER_NBUNKSEC:?Set the NGIT_PUBLISHER_NBUNKSEC secret.}"
          signer_file="$RUNNER_TEMP/ngit-publisher.nbunksec"
          trap 'rm -f "$signer_file"' EXIT
          umask 077
          printf '%s' "$NGIT_PUBLISHER_NBUNKSEC" > "$signer_file"
          ngit nsite publish dist \
            --repo nostr://dan@gitworkshop.dev/gitnostr.com/gitworkshop \
            --nbunksec-file "$signer_file" \
            --concurrency 12 \
            --defaults \
            --json

  build-android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, android-lint]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -eu
          : "${ANDROID_KEYSTORE_BASE64:?Set the ANDROID_KEYSTORE_BASE64 secret.}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Set the ANDROID_KEYSTORE_PASSWORD secret.}"
          : "${ANDROID_KEY_ALIAS:?Set the ANDROID_KEY_ALIAS secret.}"

          signing_dir="$RUNNER_TEMP/gitworkshop-signing"
          keystore="$signing_dir/gitworkshop-upload.jks"
          umask 077
          mkdir -p "$signing_dir"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          cat > android/signing.properties <<EOF
          storeFile=$keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - run: pnpm install --frozen-lockfile

      - name: Read app version
        id: version
        run: |
          set -eu
          . ./version.properties
          printf 'name=%s\n' "$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release tag
        if: github.ref_type == 'tag'
        run: |
          set -eu
          . ./version.properties
          expected_tag="v$APP_VERSION"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            printf 'Release tag must be %s, got %s\n' "$expected_tag" "$GITHUB_REF_NAME" >&2
            exit 1
          fi

      # Build both distributable formats in one Gradle invocation. Zapstore
      # publishing runs in a dependent job using the uploaded signed APK.
      - run: pnpm android:build:release

      - name: Name release artifacts
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -eu
          release_dir="$RUNNER_TEMP/gitworkshop-android-v$VERSION_NAME"
          mkdir -p "$release_dir"
          cp android/app/build/outputs/apk/release/app-release.apk \
            "$release_dir/gitworkshop-android-v$VERSION_NAME.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab \
            "$release_dir/gitworkshop-android-v$VERSION_NAME.aab"

      # The AAB and APK have been signed at this point, so neither the keystore
      # nor the generated file containing its passwords is needed any longer.
      # Run even when the build fails after signing configuration is created.
      - name: Remove release signing material
        if: ${{ always() }}
        run: |
          rm -f android/signing.properties
          rm -rf "$RUNNER_TEMP/gitworkshop-signing"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitworkshop-android-v${{ steps.version.outputs.name }}
          path: |
            ${{ runner.temp }}/gitworkshop-android-v${{ steps.version.outputs.name }}/gitworkshop-android-v${{ steps.version.outputs.name }}.apk
            ${{ runner.temp }}/gitworkshop-android-v${{ steps.version.outputs.name }}/gitworkshop-android-v${{ steps.version.outputs.name }}.aab
          if-no-files-found: error

  publish-zapstore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-android-release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Download signed APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gitworkshop-android-v${{ needs.build-android-release.outputs.version }}
          path: release-artifacts

      - name: Publish to Zapstore
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_BUNKER_URL }}
          ZAPSTORE_CLIENT_KEY: ${{ secrets.ZAPSTORE_CLIENT_KEY }}
          VERSION_NAME: ${{ needs.build-android-release.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELAY_URLS: wss://relay.zapstore.dev,wss://relay.ditto.pub,wss://relay.dreamith.to,wss://relay.primal.net
        run: |
          set -eu
          : "${SIGN_WITH:?Set the ZAPSTORE_BUNKER_URL secret.}"
          : "${ZAPSTORE_CLIENT_KEY:?Set the ZAPSTORE_CLIENT_KEY secret.}"

          if [ "$RELEASE_REF_TYPE" = "tag" ]; then
            VERSION_NAME="${RELEASE_TAG#v}"
          fi

          apk_path="release-artifacts/gitworkshop-android-v$VERSION_NAME.apk"
          test -f "$apk_path"

          go install github.com/zapstore/zsp@latest
          export PATH="$(go env GOPATH)/bin:$PATH"

          # zsp creates a NIP-46 client key on first use. Restore that key so
          # the bunker recognizes this CI workflow as the same application.
          bunker_pubkey="${SIGN_WITH#bunker://}"
          bunker_pubkey="${bunker_pubkey%%\?*}"
          test "$bunker_pubkey" != "$SIGN_WITH"
          umask 077
          mkdir -p ~/.config/zsp/bunker-keys
          printf '%s\n' "$ZAPSTORE_CLIENT_KEY" > ~/.config/zsp/bunker-keys/"$bunker_pubkey".key

          release_config="$(mktemp zapstore-release.XXXXXX.yaml)"
          trap 'rm -f "$release_config"' EXIT
          cp zapstore.yaml "$release_config"
          sed -i "2i release_source: ./$apk_path" "$release_config"
          sed -i "2i version: $VERSION_NAME" "$release_config"
          zsp publish --quiet --skip-metadata --skip-preview "$release_config"
